<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // 주소가 끝에 "/" 없이 폴더 경로로 열리면(예: /games/sudoku) style.css, script.js 같은
    // 상대경로가 상위 폴더 기준으로 깨진다. <base> 태그로는 브라우저 프리로드 스캐너가
    // 아직 고쳐지지 않은 원래 경로로 CSS를 먼저 요청해버려 소용없으므로, 태그 자체를
    // 정적으로 두지 않고 경로를 계산해 직접 써넣는다.
    window.__gameBase = (function () {
      var path = location.pathname;
      if (/\/$/.test(path)) return path;
      var lastSlash = path.lastIndexOf("/");
      var lastSegment = path.slice(lastSlash + 1);
      return lastSegment.indexOf(".") !== -1 ? path.slice(0, lastSlash + 1) : path + "/";
    })();
    // 로그인/계정은 사이트 전체 공용이라 games/<id>/ 두 단계 위 사이트 루트에 있는
    // firebase-config.js, auth.js를 그대로 가져다 쓴다.
    window.__siteBase = window.__gameBase.replace(/games\/[^/]+\/$/, "");
    document.write('<link rel="stylesheet" href="' + window.__siteBase + 'theme.css">');
    document.write('<link rel="stylesheet" href="' + window.__siteBase + 'site-header.css">');
    document.write('<link rel="stylesheet" href="' + window.__gameBase + 'style.css">');
  </script>
  <title>스도쿠 - 미니게임 모음</title>
</head>
<body>
  <script>
    document.write('<script src="' + window.__siteBase + 'site-header.js"><\/script>');
  </script>

  <a class="back-link" href="../../index.html">← 목록으로</a>
  <h1>스도쿠</h1>

  <div id="difficulty-screen" class="difficulty-screen">
    <p class="difficulty-prompt">난이도를 선택하세요</p>
    <div class="difficulty-group difficulty-group--start" role="group" aria-label="난이도 선택">
      <button class="diff-btn diff-btn--start" data-difficulty="easy">쉬움</button>
      <button class="diff-btn diff-btn--start" data-difficulty="medium">중간</button>
      <button class="diff-btn diff-btn--start" data-difficulty="hard">어려움</button>
    </div>
  </div>

  <div id="game-screen" class="game-screen" hidden>
    <div class="controls">
      <div class="action-group">
        <button id="new-game-btn">새 게임</button>
        <button id="reset-btn">다시 풀기</button>
        <button id="change-difficulty-btn">난이도 다시 선택</button>
      </div>
    </div>

    <div class="status-bar">
      <span id="timer">00:00</span>
      <span id="best-time"></span>
    </div>

    <p id="loading-msg" class="loading-msg" hidden>퍼즐 생성 중...</p>

    <div class="board-frame">
      <div id="board" class="sudoku-board" role="grid" aria-label="스도쿠 보드"></div>
    </div>

    <div class="number-pad" id="number-pad">
      <button class="num-btn" data-num="1">1</button>
      <button class="num-btn" data-num="2">2</button>
      <button class="num-btn" data-num="3">3</button>
      <button class="num-btn" data-num="4">4</button>
      <button class="num-btn" data-num="5">5</button>
      <button class="num-btn" data-num="6">6</button>
      <button class="num-btn" data-num="7">7</button>
      <button class="num-btn" data-num="8">8</button>
      <button class="num-btn" data-num="9">9</button>
      <button class="num-btn erase-btn" data-num="0">지우기</button>
    </div>

    <div id="win-overlay" class="win-overlay" hidden>
      <div class="win-card">
        <p class="win-title">🎉 완료했습니다!</p>
        <p id="win-time"></p>
        <p id="win-points" class="win-points"></p>
        <button id="win-close-btn">새 게임</button>
      </div>
    </div>
  </div>

  <script>
    document.write('<script src="' + window.__siteBase + 'firebase-config.js"><\/script>');
  </script>
  <script>
    document.write('<script src="' + window.__siteBase + 'auth.js"><\/script>');
  </script>
  <script>
    document.write('<script src="' + window.__gameBase + 'script.js"><\/script>');
  </script>
</body>
</html>
