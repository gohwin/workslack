<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>workslack.gg</title>
  <link rel="stylesheet" href="site-header.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <script src="site-header.js"></script>

  <header class="hero">
    <div class="hero-glow hero-glow-a"></div>
    <div class="hero-glow hero-glow-b"></div>
    <p class="eyebrow">WORKSLACK.GG</p>
    <h1>일하다 말고, <span class="text-accent">잠깐</span> 딴짓</h1>
    <p class="subtitle">가볍게 즐기는 미니게임을 한곳에 모았습니다. 계정을 만들면 완료할 때마다 점수가 쌓여요.</p>
  </header>

  <div class="content-layout">
    <main>
      <div id="loading-state" class="state-message" hidden>불러오는 중...</div>
      <div id="empty-state" class="state-message" hidden>
        <p>아직 등록된 게임이 없어요.</p>
        <p class="state-sub">게임이 추가되면 이곳에 카드로 표시됩니다.</p>
      </div>
      <div id="error-state" class="state-message" hidden>
        <p>게임 목록을 불러오지 못했어요.</p>
      </div>
      <div id="game-grid" class="game-grid" hidden></div>
    </main>

    <aside class="sidebar">
      <div class="sidebar-card">
        <h2>전체 누적 점수 랭킹</h2>
        <p id="alltime-leaderboard-status" class="leaderboard-status"></p>
        <ol id="alltime-leaderboard-list" class="leaderboard-list"></ol>
      </div>

      <div class="sidebar-card">
        <h2>오늘 획득한 점수</h2>
        <p id="daily-leaderboard-status" class="leaderboard-status"></p>
        <ol id="daily-leaderboard-list" class="leaderboard-list"></ol>
      </div>
    </aside>
  </div>

  <footer class="site-footer">
    <p>새 게임 추가 방법은 <a href="README.md">README</a>를 참고하세요.</p>
  </footer>

  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="leaderboard.js"></script>
  <script src="main.js"></script>
</body>
</html>
