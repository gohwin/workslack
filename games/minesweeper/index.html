<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // 주소가 끝에 "/" 없이 폴더 경로로 열리면(예: /games/minesweeper) style.css, script.js 같은
    // 상대경로가 상위 폴더 기준으로 깨진다. <base> 태그로는 브라우저 프리로드 스캐너가
    // 아직 고쳐지지 않은 원래 경로로 CSS를 먼저 요청해버려 소용없으므로, 태그 자체를
    // 정적으로 두지 않고 경로를 계산해 직접 써넣는다.
    window.__gameBase = (function () {
      var path = location.pathname;
      if (/\/$/.test(path)) return path;
      var lastSlash = path.lastIndexOf("/");
      var lastSegment = path.slice(lastSlash + 1);
      return lastSegment.indexOf(".") !== -1 ? path.slice(0, lastSlash + 1) : path + "/";
    })();
    // 로그인/계정은 사이트 전체 공용이라 games/<id>/ 두 단계 위 사이트 루트에 있는
    // firebase-config.js, auth.js를 그대로 가져다 쓴다.
    window.__siteBase = window.__gameBase.replace(/games\/[^/]+\/$/, "");
    // site-header.js writes this into the nav bar's back link + title
    // instead of the page repeating them as its own back-link/<h1>.
    window.__gameTitle = "지뢰찾기";
    document.write('<link rel="stylesheet" href="' + window.__siteBase + 'theme.css">');
    document.write('<link rel="stylesheet" href="' + window.__siteBase + 'site-header.css">');
    document.write('<link rel="stylesheet" href="' + window.__gameBase + 'style.css">');
  </script>
  <title>지뢰찾기 - 미니게임 모음</title>
</head>
<body>
  <script>
    document.write('<script src="' + window.__siteBase + 'site-header.js"><\/script>');
  </script>


  <div id="difficulty-screen" class="difficulty-screen">
    <p class="difficulty-prompt">난이도를 선택하세요</p>
    <div class="difficulty-group difficulty-group--start" role="group" aria-label="난이도 선택">
      <button class="diff-btn diff-btn--start" data-difficulty="easy">쉬움<span class="diff-sub">9×9 · 지뢰 10개</span></button>
      <button class="diff-btn diff-btn--start" data-difficulty="medium">중간<span class="diff-sub">16×16 · 지뢰 40개</span></button>
      <button class="diff-btn diff-btn--start" data-difficulty="hard">어려움<span class="diff-sub">16×30 · 지뢰 99개</span></button>
    </div>
  </div>

  <div id="game-screen" class="game-screen" hidden>
    <div class="controls">
      <div class="action-group">
        <button id="new-game-btn">새 게임</button>
        <button id="flag-mode-btn" aria-pressed="false">🚩 깃발 모드</button>
        <button id="change-difficulty-btn">난이도 다시 선택</button>
      </div>
    </div>

    <div class="status-bar">
      <span id="mine-count">💣 0</span>
      <span id="timer">⏱ 00:00</span>
      <span id="best-time"></span>
    </div>

    <div class="board-wrapper">
      <div id="board" class="mine-board" role="grid" aria-label="지뢰찾기 보드"></div>
    </div>

    <p class="hint-text">칸을 클릭해 열고, 우클릭(또는 깃발 모드 켜고 탭)으로 깃발을 꽂으세요.</p>

    <div id="result-overlay" class="result-overlay" hidden>
      <div class="result-card">
        <p id="result-title" class="result-title"></p>
        <p id="result-time"></p>
        <p id="result-points" class="win-points"></p>
        <button id="result-close-btn">새 게임</button>
      </div>
    </div>
  </div>

  <script>
    document.write('<script src="' + window.__siteBase + 'firebase-config.js"><\/script>');
  </script>
  <script>
    document.write('<script src="' + window.__siteBase + 'auth.js"><\/script>');
  </script>
  <script>
    document.write('<script src="' + window.__gameBase + 'script.js"><\/script>');
  </script>
</body>
</html>
